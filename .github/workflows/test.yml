name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check --no-cache custom_components/adaptive_cover tests
      - name: Run unit and Home Assistant integration tests
        run: python tests/run_pytest.py -q
