export_config:
  name: Eksportuj konfigurację
  description: Zapisuje ustawienia Adaptive Cover do pliku JSON w katalogu /config, co pozwala na analizę i łatwe kopie zapasowe.
  fields:
    filename:
      name: Nazwa pliku
      description: Bazowa nazwa pliku do zapisu. Przy włączonej dacie wynik będzie miał postać DD.MM.RRRR_adaptive_cover_settings.json.
      required: true
      default: adaptive_cover_settings.json
      example: adaptive_cover_settings.json
      selector:
        text:
    include_date:
      name: Dodaj bieżącą datę do nazwy
      description: Dodaje lokalną datę Home Assistant na początku nazwy pliku i zastępuje ewentualny wcześniejszy prefiks daty.
      required: false
      default: true
      selector:
        boolean:

import_config:
  name: Importuj konfigurację
  description: Wczytuje ustawienia Adaptive Cover z pliku JSON w katalogu /config i nadpisuje aktualną konfigurację bez potrzeby ponownego uruchamiania.
  fields:
    filename:
      name: Nazwa pliku
      description: Nazwa pliku z konfiguracją do wczytania, np. adaptive_cover_settings.json. Plik musi znajdować się w głównym katalogu konfiguracyjnym Home Assistant (/config).
      required: true
      default: adaptive_cover_settings.json
      example: adaptive_cover_settings.json
      selector:
        text:

export_diagnostics:
  name: Eksportuj diagnostykę
  description: Zapisuje pełny obraz działania Adaptive Cover, w tym konfigurację, aktualne decyzje algorytmu, statusy rolet i stany powiązanych encji.
  fields:
    filename:
      name: Nazwa pliku
      description: Bazowa nazwa pliku do zapisu. Przy włączonej dacie wynik będzie miał postać DD.MM.RRRR_adaptive_cover_diagnostics.json.
      required: true
      default: adaptive_cover_diagnostics.json
      example: adaptive_cover_diagnostics.json
      selector:
        text:
    include_date:
      name: Dodaj bieżącą datę do nazwy
      description: Dodaje lokalną datę Home Assistant na początku nazwy pliku i zastępuje ewentualny wcześniejszy prefiks daty.
      required: false
      default: true
      selector:
        boolean:
    refresh:
      name: Odśwież dane przed eksportem
      description: Wymusza bezpieczne przeliczenie danych bez wykonywania ruchów rolet. Odświeżenie ma limit 30 sekund.
      required: false
      default: true
      selector:
        boolean:
